name: Custom Alloy Release Pipeline

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

env:
  ALLOY_IMAGE_PREFIX: ghcr.io/${{ github.repository }}/alloy-custom
  ALLOY_BINARY_PREFIX: build/alloy-custom

jobs:
  determine-channel:
    runs-on: ubuntu-latest
    outputs:
      channel: ${{ steps.set-channel.outputs.channel }}
    steps:
      - id: set-channel
        run: |
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            if [[ "${{ github.ref_name }}" == *-rc.* ]] || [[ "${{ github.ref_name }}" == *-beta.* ]]; then
              echo "channel=BETA" >> $GITHUB_OUTPUT
            else
              echo "channel=STABLE" >> $GITHUB_OUTPUT
            fi
          else
            echo "channel=ALPHA" >> $GITHUB_OUTPUT
          fi

  build-and-publish:
    needs: determine-channel
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'

      - name: Set Image Tag
        run: |
          if [[ "${{ needs.determine-channel.outputs.channel }}" == "ALPHA" ]]; then
            echo "IMAGE_TAG=alpha" >> $GITHUB_ENV
          elif [[ "${{ needs.determine-channel.outputs.channel }}" == "BETA" ]]; then
            echo "IMAGE_TAG=beta" >> $GITHUB_ENV
          else
            echo "IMAGE_TAG=latest" >> $GITHUB_ENV
          fi

      - name: Build Binary
        run: |
          make alloy BINARY_PREFIX=$ALLOY_BINARY_PREFIX

      - name: Upload Binary Artifact
        uses: actions/upload-artifact@v4
        with:
          name: alloy-custom-binary
          path: ${{ env.ALLOY_BINARY_PREFIX }}

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker Image
        run: |
          make alloy-image IMAGE_PREFIX=${{ env.ALLOY_IMAGE_PREFIX }}

      - name: Push Docker Image
        run: |
          docker push ${{ env.ALLOY_IMAGE_PREFIX }}:${{ env.IMAGE_TAG }}
